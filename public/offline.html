<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#164C92" />
    <title>غير متصل | حجوزاتي للمكاتب</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F3F5F9;
        color: #1A2138;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 20px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #FFFFFF;
        border: 1px solid #E5E9F2;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0px 2px 8px rgba(14, 36, 71, 0.05);
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        border-radius: 16px;
        background: #EBF1FA;
        color: #164C92;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        color: #64748B;
        line-height: 1.7;
      }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #164C92;
        color: #FFFFFF;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(22, 76, 146, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">!</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذر تحميل بيانات المكتب من الخادم. يرجى التحقق من اتصالك بالإنترنت ثم إعادة المحاولة.
      </p>
      <button onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
